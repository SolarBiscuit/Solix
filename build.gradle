plugins {
    id 'fabric-loom' version '1.7.4'
}

group = mod_group_id
// jar: solix-<forge version it is synced to>-mc1.20.1-fabric.jar; fabric.mod.json version: <mod_version>+fabric[.N]
version = "${mod_version}-mc${minecraft_version}-fabric"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
    runs {
        configureEach {
            property 'mixin.debug.verify', 'true'
        }
        server {
            programArgs '--nogui'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang mappings, same names as the Forge source: engine code is shared between the two branches unchanged.
    mappings loom.officialMojangMappings()
    // Solix only needs Fabric Loader (no Fabric API), like upstream Starlight Fabric.
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: "${mod_version}+fabric${fabric_revision.isEmpty() ? '' : '.' + fabric_revision}",
            mod_description: mod_description, minecraft_version_range: minecraft_version_range,
            loader_version_min: loader_version_min,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    from('LICENSE-FlowSched.txt')
    from('NOTICE') {
        rename { "NOTICE_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
