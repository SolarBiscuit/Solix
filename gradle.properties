org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
# fabric.mod.json "minecraft" predicate: 1.20.1 only (Solix's mixins target 1.20.1 code)
minecraft_version_range=1.20.1
# Fabric Loader used to build/run in dev; loader_version_min is what fabric.mod.json requires at runtime
loader_version=0.16.5
loader_version_min=0.14.21

# Fabric branch: mod_version mirrors the Forge version this branch is synced to (CHANGELOG.txt, docs/FABRIC.md).
# fabric_revision counts Fabric-only builds on top of it: empty = <mod_version>+fabric, 1 = <mod_version>+fabric.1, ...
# Reset fabric_revision to empty when merging a new Forge version.
mod_id=solix
mod_name=Solix
mod_license=LGPL-3.0-only
mod_version=0.3.7
fabric_revision=
mod_group_id=com.solarbiscuit.solix
mod_authors=SolarBiscuit, Spottedleaf, RelativityMC (ScalableLux)
mod_description=Light engine for Fabric 1.20.1 based on Starlight (Spottedleaf) with ScalableLux's (RelativityMC) parallel light scheduler and upstream fixes.
